# =============================================================================
# Churn MLOps — Databricks Asset Bundle (dbdemos advanced churn, deploy-code)
# One codebase, three stages by SCHEMA. Code promotes dev -> staging -> prod
# through CI/CD (GitHub Actions or Azure DevOps) with three human gates: code
# review on the pull request (Gate 1), approval of the production release
# (Gate 2), and a Unity Catalog model approval before serving (Gate 3).
# =============================================================================
bundle:
  name: churn-mlops

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog (Default-Storage sandbox metastore)
    default: <CATALOG>            # e.g. your Unity Catalog name
  schema:
    description: Per-stage schema (dev/staging/prod isolation)
    default: dbdemos_mlops
  model_short_name:
    default: advanced_mlops_churn
  service_principal_app_id:
    description: CI service principal (staging/prod run_as)
    default: "<CI_SERVICE_PRINCIPAL_APP_ID>"

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: dbdemos_mlops_dev

  staging:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/churn-mlops/staging
    variables:
      schema: dbdemos_mlops_staging
    # run_as defaults to the deploying identity (the CI service principal when
    # deployed by the Azure DevOps pipeline; the developer for local deploys).

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/churn-mlops/prod
    variables:
      schema: dbdemos_mlops_prod
    # run_as defaults to the deploying identity (CI SP via pipeline; dev locally).
